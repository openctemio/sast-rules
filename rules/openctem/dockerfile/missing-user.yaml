# SPDX-License-Identifier: MIT
# Source: https://github.com/openctemio/sast-rules
rules:
- id: openctem.dockerfile.missing-user
  languages: [dockerfile]
  severity: INFO
  message: >-
    The image's last stage never switches to a non-root USER, so the process
    runs as root in the container. Add a USER instruction with an unprivileged
    user before CMD/ENTRYPOINT.
  metadata:
    category: security
    cwe: ["CWE-250: Execution with Unnecessary Privileges"]
    owasp: ["A05:2021 - Security Misconfiguration"]
    confidence: MEDIUM
    likelihood: LOW
    impact: MEDIUM
  patterns:
  - pattern-either:
    - pattern: CMD ...
    - pattern: ENTRYPOINT ...
  - pattern-not-inside: |
      USER $U
      ...