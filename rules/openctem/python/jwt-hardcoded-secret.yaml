# Source: https://github.com/openctemio/sast-rules
rules:
- id: openctem.python.crypto.jwt-hardcoded-secret
  languages: [python]
  severity: ERROR
  message: >-
    A JWT is signed or verified with a key written in the code. Anyone with the
    code can forge tokens. Load the key from a secret store or the environment.
  metadata:
    category: security
    cwe: ["CWE-798: Use of Hard-coded Credentials"]
    owasp: ["A07:2021 - Identification and Authentication Failures"]
    confidence: HIGH
    likelihood: MEDIUM
    impact: HIGH
  pattern-either:
  - pattern: jwt.encode($P, "...", ...)
  - pattern: jwt.decode($T, "...", ...)