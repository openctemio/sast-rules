# Source: https://github.com/openctemio/sast-rules
rules:
- id: openctem.java.crypto.weak-random
  languages: [java]
  severity: WARNING
  message: >-
    java.util.Random is predictable: a few outputs reveal the rest. Do not use
    it for secrets, tokens, PINs or IDs that must be unguessable; use
    java.security.SecureRandom.
  metadata:
    category: security
    cwe: ["CWE-330: Use of Insufficiently Random Values"]
    owasp: ["A02:2021 - Cryptographic Failures"]
    confidence: LOW
    likelihood: LOW
    impact: MEDIUM
  pattern-either:
  - pattern: new java.util.Random(...).$M(...)
  - pattern: new Random(...).$M(...)
  - pattern: Math.random()