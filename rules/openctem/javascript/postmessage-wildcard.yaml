# Source: https://github.com/openctemio/sast-rules
rules:
- id: openctem.javascript.browser.postmessage-wildcard-origin
  languages: [javascript, typescript]
  severity: WARNING
  message: >-
    postMessage with target origin "*" delivers the message to whatever page is
    loaded in that window, including a malicious one. Name the receiver's origin.
  metadata:
    category: security
    cwe: ["CWE-345: Insufficient Verification of Data Authenticity"]
    owasp: ["A08:2021 - Software and Data Integrity Failures"]
    confidence: HIGH
    likelihood: LOW
    impact: MEDIUM
  pattern: $W.postMessage($M, "*", ...)