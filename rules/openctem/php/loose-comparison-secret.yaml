# Source: https://github.com/openctemio/sast-rules
rules:
- id: openctem.php.auth.loose-comparison-secret
  languages: [php]
  severity: WARNING
  message: >-
    A hash, token or password is compared with ==. PHP's loose comparison
    treats strings like "0e123" and "0e456" as equal numbers, so a crafted
    value can pass the check. Use hash_equals() for secrets, or === .
  metadata:
    category: security
    cwe: ["CWE-697: Incorrect Comparison"]
    owasp: ["A07:2021 - Identification and Authentication Failures"]
    confidence: MEDIUM
    likelihood: LOW
    impact: HIGH
  pattern-either:
  - pattern: $A == md5(...)
  - pattern: md5(...) == $A
  - pattern: $A == sha1(...)
  - pattern: sha1(...) == $A
  - pattern: $A == hash(...)
  - pattern: hash(...) == $A
  - patterns:
    - pattern-either:
      - pattern: $A == $B
      - pattern: $A != $B
    - metavariable-regex:
        metavariable: $A
        regex: (?i).*(pass|token|hash|secret|signature).*
    - pattern-not: $A == "..."
    - pattern-not: $A != "..."
