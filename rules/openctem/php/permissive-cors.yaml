# SPDX-License-Identifier: MIT
# Source: https://github.com/openctemio/sast-rules
rules:
- id: openctem.php.config.permissive-cors
  languages: [php]
  severity: WARNING
  message: >-
    Access-Control-Allow-Origin: * lets every web site read this response from
    a visitor's browser. Allow the origins that need it by name.
  metadata:
    category: security
    cwe: ["CWE-942: Permissive Cross-domain Policy with Untrusted Domains"]
    owasp: ["A05:2021 - Security Misconfiguration"]
    confidence: HIGH
    likelihood: LOW
    impact: MEDIUM
  pattern-either:
  - patterns:
    - pattern: header($H, ...)
    - metavariable-regex:
        metavariable: $H
        regex: (?i)^['"]\s*access-control-allow-origin\s*:\s*\*\s*['"]$
