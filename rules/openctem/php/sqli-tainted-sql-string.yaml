# Source: https://github.com/openctemio/sast-rules
rules:
- id: openctem.php.sqli.tainted-sql-string
  languages: [php]
  severity: ERROR
  message: >-
    Request data is placed into an SQL statement by string interpolation or
    concatenation. Use a prepared statement with bound parameters
    (mysqli_prepare, PDO::prepare).
  metadata:
    category: security
    cwe: ["CWE-89: Improper Neutralization of Special Elements used in an SQL Command ('SQL Injection')"]
    owasp: ["A03:2021 - Injection"]
    confidence: MEDIUM
    likelihood: HIGH
    impact: HIGH
    references: ["https://www.php.net/manual/en/mysqli.quickstart.prepared-statements.php"]
  mode: taint
  pattern-sources:
  - pattern-either:
    - pattern: $_GET
    - pattern: $_POST
    - pattern: $_REQUEST
    - pattern: $_COOKIE
    - pattern: file_get_contents('php://input')
    - patterns:
      - pattern: $_SERVER[$K]
      - metavariable-regex:
          metavariable: $K
          regex: ^['"]HTTP_.*
  pattern-sanitizers:
  - pattern-either:
    - pattern: intval(...)
    - pattern: (int) $X
    - pattern: is_numeric(...)
  pattern-sinks:
  - pattern-either:
    - patterns:
      - pattern: '"...$X..."'
      - pattern: $STR
      - metavariable-regex:
          metavariable: $STR
          regex: (?is).*\b(select\s|insert\s+into|update\s|delete\s+from|replace\s+into).*
    - patterns:
      - pattern-either:
        - pattern: '"$S" . $X'
        - pattern: 'sprintf("$S", ...)'
      - metavariable-regex:
          metavariable: $S
          regex: (?is).*\b(select\s|insert\s+into|update\s|delete\s+from|replace\s+into).*
