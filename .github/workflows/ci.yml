name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  rules:
    name: Rules (licence, fixtures, validate, test)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Install opengrep (pinned, signature verified)
        run: scripts/install-opengrep.sh "$HOME/.local/bin"
      - name: Licence headers, fixtures, unique ids
        run: python3 scripts/check_rules.py rules
      - name: NOTICE is current
        run: python3 scripts/gen_notice.py --check
      - name: opengrep accepts every rule
        run: opengrep scan --validate --config rules --disable-version-check /dev/null
      - name: Every rule passes its positive and negative cases
        run: opengrep scan --test --disable-version-check rules/

  coverage:
    name: Coverage on the benchmark repositories
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Install opengrep (pinned, signature verified)
        run: scripts/install-opengrep.sh "$HOME/.local/bin"
      - name: Run the pack on every benchmark repository
        run: |
          bench/run.sh "$RUNNER_TEMP/bench" --min 80 --languages php,python,javascript,java,go \
            --json "$RUNNER_TEMP/coverage.json" | tee "$RUNNER_TEMP/coverage.md"
      - name: Job summary
        if: always()
        run: |
          { echo "## Coverage of the reference locations (bench/)"; echo; cat "$RUNNER_TEMP/coverage.md"; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: coverage
          path: ${{ runner.temp }}/coverage.json
